<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дашборд отдела продаж</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #6b7280;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
    .container { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
    h1 { font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 700; }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .filter-card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid #e5e7eb;
      display: grid;
      gap: 8px;
    }
    .filter-title { color: var(--muted); font-size: 0.9rem; }
    select, input[type="date"] {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: #111827;
    }
    select[multiple] { min-height: 104px; }
    .date-range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
    .kpi-card { background: var(--card); box-shadow: var(--shadow); border-radius: var(--radius); padding: 16px; border: 1px solid #e5e7eb; }
    .kpi-title { color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
    .kpi-value { font-size: 1.5rem; font-weight: 700; }

    .charts-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .chart-card { background: var(--card); box-shadow: var(--shadow); border-radius: var(--radius); padding: 16px; border: 1px solid #e5e7eb; min-height: 320px; display: flex; flex-direction: column; gap: 10px; }
    .chart-card h2 { font-size: 1rem; font-weight: 600; color: #111827; }
    .chart-wrap { position: relative; flex: 1; min-height: 240px; }
    .line-chart { grid-column: span 12; }
    .pie-chart { grid-column: span 5; }
    .bar-chart { grid-column: span 7; }

    .empty-state { display: none; background: var(--card); border-radius: var(--radius); border: 1px dashed #cbd5e1; padding: 24px; text-align: center; color: var(--muted); font-size: 1.1rem; }

    @media (max-width: 900px) {
      .pie-chart, .bar-chart, .line-chart { grid-column: span 12; }
      .date-range { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Аналитика звонков отдела продаж</h1>

    <section class="filters-grid">
      <article class="filter-card">
        <div class="filter-title">Менеджеры (множественный выбор)</div>
        <select id="managerFilter" multiple></select>
      </article>

      <article class="filter-card">
        <div class="filter-title">Период</div>
        <select id="periodFilter">
          <option value="today">Сегодня</option>
          <option value="yesterday">Вчера</option>
          <option value="week">Неделя</option>
          <option value="month">Месяц</option>
          <option value="quarter">Квартал</option>
          <option value="year">Год</option>
          <option value="custom">Произвольный период</option>
        </select>
        <div class="date-range" id="customDateRange" style="display:none;">
          <input type="date" id="dateFrom" />
          <input type="date" id="dateTo" />
        </div>
      </article>

      <article class="filter-card">
        <div class="filter-title">Детализация по датам</div>
        <select id="groupByFilter">
          <option value="hour">По часам</option>
          <option value="day" selected>По дням</option>
          <option value="week">По неделям</option>
          <option value="month">По месяцам</option>
        </select>
      </article>
    </section>

    <section class="kpi-grid" id="kpiGrid">
      <article class="kpi-card"><div class="kpi-title">Всего звонков</div><div class="kpi-value" id="kpiTotal">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Входящие</div><div class="kpi-value" id="kpiIncoming">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Исходящие</div><div class="kpi-value" id="kpiOutgoing">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Пропущенные</div><div class="kpi-value" id="kpiMissed">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Неотвеченные</div><div class="kpi-value" id="kpiUnanswered">0</div></article>
    </section>

    <section class="empty-state" id="emptyState">Нет данных</section>

    <section class="charts-grid" id="chartsGrid">
      <article class="chart-card line-chart">
        <h2 id="trendTitle">Звонки по дням</h2>
        <div class="chart-wrap"><canvas id="callsByDayChart"></canvas></div>
      </article>
      <article class="chart-card pie-chart">
        <h2>Типы звонков</h2>
        <div class="chart-wrap"><canvas id="callTypesChart"></canvas></div>
      </article>
      <article class="chart-card bar-chart">
        <h2>Звонки по менеджерам</h2>
        <div class="chart-wrap"><canvas id="managerCallsChart"></canvas></div>
      </article>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxTZ0CxeU2C9VLBnJeBH-0E_5bQqSes4ffekvQGR5J55iTXbBiCXeDA787bFDmu6xtEow/exec';
    const chartInstances = [];
    let allCalls = [];

    const els = {
      managerFilter: document.getElementById('managerFilter'),
      periodFilter: document.getElementById('periodFilter'),
      groupByFilter: document.getElementById('groupByFilter'),
      customDateRange: document.getElementById('customDateRange'),
      dateFrom: document.getElementById('dateFrom'),
      dateTo: document.getElementById('dateTo'),
      trendTitle: document.getElementById('trendTitle'),
      kpiTotal: document.getElementById('kpiTotal'),
      kpiIncoming: document.getElementById('kpiIncoming'),
      kpiOutgoing: document.getElementById('kpiOutgoing'),
      kpiMissed: document.getElementById('kpiMissed'),
      kpiUnanswered: document.getElementById('kpiUnanswered'),
      emptyState: document.getElementById('emptyState'),
      chartsGrid: document.getElementById('chartsGrid')
    };

    function normalizeDate(dateValue) {
      if (!dateValue) return null;
      const d = new Date(dateValue);
      if (!Number.isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      const raw = String(dateValue).slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : null;
    }

    function normalizeDateTime(dateValue, timeValue) {
      const d = new Date(`${dateValue || ''} ${timeValue || ''}`.trim());
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function getWeekStartISO(dateObj) {
      const d = new Date(dateObj);
      const day = d.getDay() || 7;
      d.setDate(d.getDate() - day + 1);
      return d.toISOString().slice(0, 10);
    }

    function getQuarter(dateObj) {
      return Math.floor(dateObj.getMonth() / 3) + 1;
    }

    function getPeriodRange(periodKey) {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

      if (periodKey === 'today') return { from: todayStart, to: todayEnd };
      if (periodKey === 'yesterday') {
        const from = new Date(todayStart); from.setDate(from.getDate() - 1);
        const to = new Date(todayEnd); to.setDate(to.getDate() - 1);
        return { from, to };
      }
      if (periodKey === 'week') {
        const from = new Date(todayStart); from.setDate(from.getDate() - 6);
        return { from, to: todayEnd };
      }
      if (periodKey === 'month') {
        return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: todayEnd };
      }
      if (periodKey === 'quarter') {
        const qStartMonth = (getQuarter(now) - 1) * 3;
        return { from: new Date(now.getFullYear(), qStartMonth, 1), to: todayEnd };
      }
      if (periodKey === 'year') {
        return { from: new Date(now.getFullYear(), 0, 1), to: todayEnd };
      }
      return null;
    }

    function inDateRange(callDate, from, to) {
      if (!callDate) return false;
      return callDate >= from && callDate <= to;
    }

    function analyzeCalls(calls, groupBy) {
      const byPeriod = {};
      const byManager = {};
      const typeMap = { 'Входящий': 0, 'Исходящий': 0, 'Неотвеченный': 0 };
      let incoming = 0;
      let outgoing = 0;
      let missed = 0;

      for (const call of calls) {
        const type = (call?.type || '').trim();
        const manager = (call?.manager || 'Не указан').trim() || 'Не указан';
        const dateOnly = normalizeDate(call?.date);
        const dt = normalizeDateTime(call?.date, call?.time);

        if (type === 'Входящий') incoming += 1;
        if (type === 'Исходящий') outgoing += 1;
        if (type === 'Неотвеченный') missed += 1;
        if (typeMap[type] !== undefined) typeMap[type] += 1;

        let key = dateOnly || 'Без даты';
        if (groupBy === 'hour' && dt) key = `${dt.toISOString().slice(0, 10)} ${String(dt.getHours()).padStart(2, '0')}:00`;
        if (groupBy === 'week' && dt) key = `Неделя с ${getWeekStartISO(dt)}`;
        if (groupBy === 'month' && dt) key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;

        byPeriod[key] = (byPeriod[key] || 0) + 1;
        byManager[manager] = (byManager[manager] || 0) + 1;
      }

      return { total: calls.length, incoming, outgoing, missed, unanswered: missed, byPeriod, byManager, typeMap };
    }

    function destroyCharts() { while (chartInstances.length) chartInstances.pop().destroy(); }

    function renderKpi(stats) {
      els.kpiTotal.textContent = stats.total;
      els.kpiIncoming.textContent = stats.incoming;
      els.kpiOutgoing.textContent = stats.outgoing;
      els.kpiMissed.textContent = stats.missed;
      els.kpiUnanswered.textContent = stats.unanswered;
    }

    function renderCharts(stats, groupBy) {
      destroyCharts();
      const labels = Object.keys(stats.byPeriod).sort();
      const values = labels.map((d) => stats.byPeriod[d]);
      const titleMap = { hour: 'Звонки по часам', day: 'Звонки по дням', week: 'Звонки по неделям', month: 'Звонки по месяцам' };
      els.trendTitle.textContent = titleMap[groupBy] || 'Звонки по дням';

      chartInstances.push(new Chart(document.getElementById('callsByDayChart'), {
        type: 'line',
        data: { labels, datasets: [{ label: 'Звонки', data: values, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.18)', fill: true, tension: 0.3, pointRadius: 3 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      }));

      chartInstances.push(new Chart(document.getElementById('callTypesChart'), {
        type: 'pie',
        data: {
          labels: ['Входящий', 'Исходящий', 'Неотвеченный'],
          datasets: [{ label: 'Тип звонка', data: [stats.typeMap['Входящий'] || 0, stats.typeMap['Исходящий'] || 0, stats.typeMap['Неотвеченный'] || 0], backgroundColor: ['#10b981', '#3b82f6', '#ef4444'] }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      }));

      const managerLabels = Object.keys(stats.byManager).sort((a, b) => stats.byManager[b] - stats.byManager[a]);
      const managerData = managerLabels.map((name) => stats.byManager[name]);
      chartInstances.push(new Chart(document.getElementById('managerCallsChart'), {
        type: 'bar',
        data: { labels: managerLabels, datasets: [{ label: 'Звонки', data: managerData, backgroundColor: '#6366f1' }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
      }));
    }

    function showNoData() { els.emptyState.style.display = 'block'; els.chartsGrid.style.display = 'none'; }
    function hideNoData() { els.emptyState.style.display = 'none'; els.chartsGrid.style.display = 'grid'; }

    function populateManagers(calls) {
      const managers = [...new Set(calls.map((c) => ((c?.manager || 'Не указан').trim() || 'Не указан')))].sort();
      els.managerFilter.innerHTML = managers.map((m) => `<option value="${m}">${m}</option>`).join('');
      for (const option of els.managerFilter.options) option.selected = true;
    }

    function getSelectedManagers() {
      return new Set([...els.managerFilter.selectedOptions].map((o) => o.value));
    }

    function applyFilters() {
      const selectedManagers = getSelectedManagers();
      const period = els.periodFilter.value;
      const groupBy = els.groupByFilter.value;
      const staticRange = getPeriodRange(period);

      let from = null;
      let to = null;
      if (period === 'custom') {
        from = els.dateFrom.value ? new Date(`${els.dateFrom.value}T00:00:00`) : null;
        to = els.dateTo.value ? new Date(`${els.dateTo.value}T23:59:59.999`) : null;
      } else if (staticRange) {
        from = staticRange.from;
        to = staticRange.to;
      }

      const filtered = allCalls.filter((call) => {
        const manager = (call?.manager || 'Не указан').trim() || 'Не указан';
        if (!selectedManagers.has(manager)) return false;

        if (!from || !to) return true;
        const dt = normalizeDateTime(call?.date, call?.time) || (normalizeDate(call?.date) ? new Date(`${normalizeDate(call?.date)}T00:00:00`) : null);
        return inDateRange(dt, from, to);
      });

      if (!filtered.length) {
        renderKpi({ total: 0, incoming: 0, outgoing: 0, missed: 0, unanswered: 0 });
        destroyCharts();
        showNoData();
        return;
      }

      hideNoData();
      const normalizedGroupBy = ['hour', 'day', 'week', 'month'].includes(groupBy) ? groupBy : 'day';
      const stats = analyzeCalls(filtered, normalizedGroupBy);
      renderKpi(stats);
      renderCharts(stats, normalizedGroupBy);
    }

    function bindFilters() {
      els.periodFilter.addEventListener('change', () => {
        els.customDateRange.style.display = els.periodFilter.value === 'custom' ? 'grid' : 'none';
        applyFilters();
      });
      els.managerFilter.addEventListener('change', applyFilters);
      els.groupByFilter.addEventListener('change', applyFilters);
      els.dateFrom.addEventListener('change', applyFilters);
      els.dateTo.addEventListener('change', applyFilters);
    }

    async function initDashboard() {
      try {
        const response = await fetch(API_URL);
        const raw = await response.json();
        allCalls = Array.isArray(raw) ? raw : [];

        if (!allCalls.length) {
          renderKpi({ total: 0, incoming: 0, outgoing: 0, missed: 0, unanswered: 0 });
          destroyCharts();
          showNoData();
          return;
        }

        populateManagers(allCalls);
        bindFilters();
        hideNoData();
        applyFilters();
      } catch (error) {
        console.log('Ошибка загрузки/обработки данных:', error);
      }
    }

    initDashboard();
  </script>
</body>
</html>
