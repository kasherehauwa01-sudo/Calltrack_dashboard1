<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дашборд отдела продаж</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #6b7280;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    h1 {
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 700;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
    }

    .kpi-card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid #e5e7eb;
    }

    .kpi-title {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .chart-card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid #e5e7eb;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chart-card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 240px;
    }

    .line-chart { grid-column: span 12; }
    .pie-chart { grid-column: span 5; }
    .bar-chart { grid-column: span 7; }

    .empty-state {
      display: none;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px dashed #cbd5e1;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 1.1rem;
    }

    @media (max-width: 900px) {
      .pie-chart,
      .bar-chart,
      .line-chart {
        grid-column: span 12;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Аналитика звонков отдела продаж</h1>

    <section class="kpi-grid" id="kpiGrid">
      <article class="kpi-card"><div class="kpi-title">Всего звонков</div><div class="kpi-value" id="kpiTotal">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Входящие</div><div class="kpi-value" id="kpiIncoming">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Исходящие</div><div class="kpi-value" id="kpiOutgoing">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Пропущенные</div><div class="kpi-value" id="kpiMissed">0</div></article>
      <article class="kpi-card"><div class="kpi-title">Средняя длительность</div><div class="kpi-value" id="kpiAvgDuration">0:00</div></article>
      <article class="kpi-card"><div class="kpi-title">% «Перезвонить»</div><div class="kpi-value" id="kpiCallback">0%</div></article>
      <article class="kpi-card"><div class="kpi-title">Отказы</div><div class="kpi-value" id="kpiRefusals">0</div></article>
    </section>

    <section class="empty-state" id="emptyState">Нет данных</section>

    <section class="charts-grid" id="chartsGrid">
      <article class="chart-card line-chart">
        <h2>Звонки по дням</h2>
        <div class="chart-wrap">
          <canvas id="callsByDayChart"></canvas>
        </div>
      </article>

      <article class="chart-card pie-chart">
        <h2>Типы звонков</h2>
        <div class="chart-wrap">
          <canvas id="callTypesChart"></canvas>
        </div>
      </article>

      <article class="chart-card bar-chart">
        <h2>Звонки по менеджерам</h2>
        <div class="chart-wrap">
          <canvas id="managerCallsChart"></canvas>
        </div>
      </article>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxTZ0CxeU2C9VLBnJeBH-0E_5bQqSes4ffekvQGR5J55iTXbBiCXeDA787bFDmu6xtEow/exec';

    const chartInstances = [];

    const els = {
      kpiTotal: document.getElementById('kpiTotal'),
      kpiIncoming: document.getElementById('kpiIncoming'),
      kpiOutgoing: document.getElementById('kpiOutgoing'),
      kpiMissed: document.getElementById('kpiMissed'),
      kpiAvgDuration: document.getElementById('kpiAvgDuration'),
      kpiCallback: document.getElementById('kpiCallback'),
      kpiRefusals: document.getElementById('kpiRefusals'),
      emptyState: document.getElementById('emptyState'),
      chartsGrid: document.getElementById('chartsGrid')
    };

    function normalizeDate(dateValue) {
      if (!dateValue) return null;
      const d = new Date(dateValue);
      if (!Number.isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      const raw = String(dateValue).slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw : null;
    }

    function parseDuration(duration) {
      if (duration === null || duration === undefined || duration === '') return 0;
      if (typeof duration === 'number') return Number.isFinite(duration) ? Math.max(0, duration) : 0;

      const raw = String(duration).trim();
      if (/^\d+$/.test(raw)) return Math.max(0, Number(raw));

      const match = raw.match(/^(\d{1,3}):(\d{1,2})$/);
      if (match) {
        const minutes = Number(match[1]);
        const seconds = Number(match[2]);
        if (!Number.isNaN(minutes) && !Number.isNaN(seconds)) {
          return Math.max(0, minutes * 60 + seconds);
        }
      }
      return 0;
    }

    function formatDuration(seconds) {
      const safe = Math.max(0, Math.round(seconds));
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function analyzeCalls(calls) {
      const byDay = {};
      const byManager = {};
      const typeMap = { 'Входящий': 0, 'Исходящий': 0, 'Неотвеченный': 0 };

      let incoming = 0;
      let outgoing = 0;
      let missed = 0;
      let durationSum = 0;
      let callbackCount = 0;
      let refusalCount = 0;

      for (const call of calls) {
        const type = (call?.type || '').trim();
        const manager = (call?.manager || 'Не указан').trim() || 'Не указан';
        const tag = String(call?.tag || '').toLowerCase();
        const date = normalizeDate(call?.date);
        const seconds = parseDuration(call?.duration);

        durationSum += seconds;

        if (type === 'Входящий') incoming += 1;
        if (type === 'Исходящий') outgoing += 1;
        if (type === 'Неотвеченный') missed += 1;

        if (typeMap[type] !== undefined) typeMap[type] += 1;

        if (date) byDay[date] = (byDay[date] || 0) + 1;
        byManager[manager] = (byManager[manager] || 0) + 1;

        if (tag.includes('перезвонить')) callbackCount += 1;
        if (tag.includes('отказ')) refusalCount += 1;
      }

      const total = calls.length;
      const avgDuration = total ? durationSum / total : 0;
      const callbackPercent = total ? (callbackCount / total) * 100 : 0;

      return {
        total,
        incoming,
        outgoing,
        missed,
        avgDuration,
        callbackPercent,
        refusalCount,
        byDay,
        byManager,
        typeMap
      };
    }

    function destroyCharts() {
      while (chartInstances.length) {
        const chart = chartInstances.pop();
        chart.destroy();
      }
    }

    function renderKpi(stats) {
      els.kpiTotal.textContent = stats.total;
      els.kpiIncoming.textContent = stats.incoming;
      els.kpiOutgoing.textContent = stats.outgoing;
      els.kpiMissed.textContent = stats.missed;
      els.kpiAvgDuration.textContent = formatDuration(stats.avgDuration);
      els.kpiCallback.textContent = `${stats.callbackPercent.toFixed(1)}%`;
      els.kpiRefusals.textContent = stats.refusalCount;
    }

    function renderCharts(stats) {
      destroyCharts();

      const dayLabels = Object.keys(stats.byDay).sort();
      const dayData = dayLabels.map((d) => stats.byDay[d]);

      chartInstances.push(new Chart(document.getElementById('callsByDayChart'), {
        type: 'line',
        data: {
          labels: dayLabels,
          datasets: [{
            label: 'Звонки',
            data: dayData,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59,130,246,0.18)',
            fill: true,
            tension: 0.3,
            pointRadius: 3
          }]
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      }));

      chartInstances.push(new Chart(document.getElementById('callTypesChart'), {
        type: 'pie',
        data: {
          labels: ['Входящий', 'Исходящий', 'Неотвеченный'],
          datasets: [{
            data: [stats.typeMap['Входящий'] || 0, stats.typeMap['Исходящий'] || 0, stats.typeMap['Неотвеченный'] || 0],
            backgroundColor: ['#10b981', '#3b82f6', '#ef4444']
          }]
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } }
        }
      }));

      const managerLabels = Object.keys(stats.byManager).sort((a, b) => stats.byManager[b] - stats.byManager[a]);
      const managerData = managerLabels.map((name) => stats.byManager[name]);

      chartInstances.push(new Chart(document.getElementById('managerCallsChart'), {
        type: 'bar',
        data: {
          labels: managerLabels,
          datasets: [{
            label: 'Звонки',
            data: managerData,
            backgroundColor: '#6366f1'
          }]
        },
        options: {
          indexAxis: 'y',
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      }));
    }

    function showNoData() {
      els.emptyState.style.display = 'block';
      els.chartsGrid.style.display = 'none';
    }

    function hideNoData() {
      els.emptyState.style.display = 'none';
      els.chartsGrid.style.display = 'grid';
    }

    async function initDashboard() {
      try {
        const response = await fetch(API_URL);
        const raw = await response.json();
        const data = Array.isArray(raw) ? raw : [];

        if (!data.length) {
          renderKpi({ total: 0, incoming: 0, outgoing: 0, missed: 0, avgDuration: 0, callbackPercent: 0, refusalCount: 0 });
          destroyCharts();
          showNoData();
          return;
        }

        hideNoData();
        const stats = analyzeCalls(data);
        renderKpi(stats);
        renderCharts(stats);
      } catch (error) {
        console.log('Ошибка загрузки/обработки данных:', error);
      }
    }

    initDashboard();
  </script>
</body>
</html>
